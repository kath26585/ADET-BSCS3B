<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registration Form</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/simple-line-icons/2.4.1/css/simple-line-icons.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="static/css/main.css">
</head>
<body>
    <div class="registration-form">
        <form action="/submit" method="POST">
            <!-- Removed the user icon -->
            <!-- Added a greeting text -->
            <div class="greeting-text">
                <h3>Hello! Welcome to CCCS 106</h3>
            </div>
            <div class="form-group">
                <input type="text" class="form-control item" id="fname" name="fname" placeholder=" Enter Your First Name (e.g., Kathlene)">
            </div>
            <div class="form-group">
                <input type="text" class="form-control item" id="mname" name="mname" placeholder="Enter Your Middle Name (e.g., Beriso)">
            </div>
            <div class="form-group">
                <input type="text" class="form-control item" id="lname" name="lname" placeholder="Enter Your Last Name (e.g., Laresma)">
            </div>
            <div class="form-group">
                <input type="text" class="form-control item" id="birth-date" name="birth_date" placeholder=" Enter Your Birth Date(e.g., 12/19/2003)">
            </div>
            <div class="form-group">
                <input type="text" class="form-control item" id="email" name="email" placeholder="Enter Your Email Address (katlaresma@gmail.com)">
            </div>
            <div class="form-group">
                <input type="text" class="form-control item" id="address" name="address" placeholder="Enter Your Address(e.g.,Nabua Camarines Sur)">
            </div>
            <div class="form-group">
                <button type="submit" class="btn btn-block submit">Submit</button>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.15/jquery.mask.min.js"></script>
    <script src="static/js/main.js"></script>
</body>
</html>
